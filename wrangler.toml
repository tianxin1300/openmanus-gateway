name = "openmanus-gateway"
main = "worker.js"
compatibility_date = "2025-01-01"
keep_vars = true
[[kv_namespaces]]
binding = "KV"
id = "b7af651ce05a42049c6da51921ccbcd7"

[[durable_objects.bindings]]
name = "CODE_CLAIMS"
class_name = "CodeClaimDO"
[[durable_objects.bindings]]
name = "CODE_RUNNER"
class_name = "CodeRunnerDO"

[[migrations]]
tag = "code-claims-v1"
new_sqlite_classes = ["CodeClaimDO"]
[[migrations]]
tag = "code-runner-v1"
new_sqlite_classes = ["CodeRunnerDO"]

[triggers]
crons = ["* * * * *"]
