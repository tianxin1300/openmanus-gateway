name: Workbench E2E manual trigger

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Target acceptance branch
        required: true
        type: choice
        options:
          - code/workbench-acceptance-phase1-20261128
        default: code/workbench-acceptance-phase1-20261128

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch test-project workflow on the acceptance branch
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: ${{ inputs.target_ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TARGET_REF" != "code/workbench-acceptance-phase1-20261128" ]]; then
            echo "Refused unexpected target ref: $TARGET_REF" >&2
            exit 1
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/test-project.yml/dispatches" \
            -f "ref=${TARGET_REF}"
          echo "Dispatched test-project.yml on ${TARGET_REF}."
