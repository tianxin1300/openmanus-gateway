name: test-project

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: test-project-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Execute tests
        run: npm test

      - name: Build checks
        run: npm run build

      # A disposable GitHub API integration test. It is intentionally limited
      # to same-repository PRs and never targets main. The generated PR's own
      # workflow run skips this step to prevent recursive test-PR creation.
      - name: GitHub branch and pull-request lifecycle E2E
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.head_ref, 'e2e/workbench-') }}
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runKey = `${context.runId}-${process.env.GITHUB_RUN_ATTEMPT || '1'}`;
            const baseBranch = `e2e/workbench-${runKey}-base`;
            const headBranch = `e2e/workbench-${runKey}-head`;
            const filePath = `e2e-workbench-${runKey}.txt`;
            const baseSha = context.payload.pull_request.head.sha;
            let baseCreated = false;
            let headCreated = false;
            let pullNumber = null;
            let prPolicyBlocked = false;
            let failure = null;
            const mainBefore = (await github.rest.git.getRef({ owner, repo, ref: 'heads/main' })).data.object.sha;

            try {
              await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${baseBranch}`, sha: baseSha });
              baseCreated = true;
              await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${headBranch}`, sha: baseSha });
              headCreated = true;

              const sourceCommit = await github.rest.git.getCommit({ owner, repo, commit_sha: baseSha });
              const blob = await github.rest.git.createBlob({
                owner, repo,
                content: `GitHub API lifecycle probe for Actions run ${runKey}\n`,
                encoding: 'utf-8'
              });
              const tree = await github.rest.git.createTree({
                owner, repo,
                base_tree: sourceCommit.data.tree.sha,
                tree: [{ path: filePath, mode: '100644', type: 'blob', sha: blob.data.sha }]
              });
              const commit = await github.rest.git.createCommit({
                owner, repo,
                message: `test: disposable workbench E2E ${runKey}`,
                tree: tree.data.sha,
                parents: [baseSha]
              });
              await github.rest.git.updateRef({
                owner, repo, ref: `heads/${headBranch}`,
                sha: commit.data.sha, force: false
              });

              try {
                const pull = await github.rest.pulls.create({
                  owner, repo,
                  title: `[E2E cleanup] workbench GitHub API ${runKey}`,
                  head: headBranch,
                  base: baseBranch,
                  body: 'Disposable integration-test PR. This PR is created and closed by the workflow; it must never be merged.'
                });
                pullNumber = pull.data.number;
                core.info(`Created disposable PR #${pullNumber} between ${headBranch} and ${baseBranch}`);
                const check = await github.rest.pulls.get({ owner, repo, pull_number: pullNumber });
                if (check.data.state !== 'open' || check.data.merged) {
                  throw new Error('Disposable PR did not enter the expected open, unmerged state');
                }
              } catch (error) {
                if (error.status === 403 && /not permitted to create or approve pull requests/i.test(error.message)) {
                  prPolicyBlocked = true;
                  core.warning('Branch/write E2E succeeded, but PR creation is blocked by the repository Actions setting "Allow GitHub Actions to create and approve pull requests".');
                } else {
                  throw error;
                }
              }
            } catch (error) {
              failure = error;
            } finally {
              if (pullNumber !== null) {
                try {
                  await github.rest.pulls.update({ owner, repo, pull_number: pullNumber, state: 'closed' });
                  const closed = await github.rest.pulls.get({ owner, repo, pull_number: pullNumber });
                  if (closed.data.state !== 'closed' || closed.data.merged) {
                    throw new Error(`PR #${pullNumber} was not closed without merging`);
                  }
                } catch (error) {
                  failure = failure || error;
                  core.error(`Failed to close disposable PR #${pullNumber}: ${error.message}`);
                }
              }
              for (const [branch, created] of [[headBranch, headCreated], [baseBranch, baseCreated], [casHeadBranch, casHeadCreated], [casBaseBranch, casBaseCreated]]) {
                if (!created) continue;
                try {
                  await github.rest.git.deleteRef({ owner, repo, ref: `heads/${branch}` });
                } catch (error) {
                  failure = failure || error;
                  core.error(`Failed to delete disposable branch ${branch}: ${error.message}`);
                }
              }
              try {
                const mainAfter = (await github.rest.git.getRef({ owner, repo, ref: 'heads/main' })).data.object.sha;
                if (mainAfter !== mainBefore) {
                  throw new Error(`main moved during E2E: before=${mainBefore}, after=${mainAfter}`);
                }
              } catch (error) {
                failure = failure || error;
              }
            }

            if (failure) throw failure;
            core.info('PASS: disposable branches and test commit were created and deleted; main SHA remained unchanged.');
            if (prPolicyBlocked) core.warning('PR create/close E2E remains unverified until the repository Actions setting is enabled.');
            else core.info('PASS: disposable PR was created, verified open/unmerged, and closed.');

# Re-trigger GitHub API lifecycle verification after repository Actions PR policy was enabled.

      # Execute the exact Worker merge helper against disposable GitHub refs.
      # This exercises the real GitHub Git Data + merge endpoints without touching main.
      - name: Workbench merge transaction GitHub API E2E
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.head_ref, 'e2e/workbench-') }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const vm = require('node:vm');
            const runKey = `${context.runId}-${process.env.GITHUB_RUN_ATTEMPT || '1'}`;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const baseBranch = `e2e-workbench-merge-${runKey}-base`;
            const headBranch = `code/e2e-workbench-merge-${runKey}-head`;
            const casBaseBranch = `e2e-workbench-cas-${runKey}-base`;
            const casHeadBranch = `code/e2e-workbench-cas-${runKey}-head`;
            const filePath = `e2e-workbench-merge-${runKey}.txt`;
            const casFilePath = `e2e-workbench-cas-${runKey}.txt`;
            const raceFilePath = `e2e-workbench-race-${runKey}.txt`;
            const baseSha = context.payload.pull_request.head.sha;
            const mainBefore = (await github.rest.git.getRef({ owner, repo, ref: 'heads/main' })).data.object.sha;
            let baseCreated = false;
            let headCreated = false;
            let casBaseCreated = false;
            let casHeadCreated = false;
            let injectRace = false;
            let raceCommitSha = "";
            let failure = null;
            let result = null;
            const worker = fs.readFileSync('worker.js', 'utf8');
            const start = worker.indexOf('function codeGitRefUrl(');
            const end = worker.indexOf('const codeHistoryKey =', start);
            if (start < 0 || end <= start) throw new Error('Could not isolate Worker Git helper source');
            const ghApi = async (_env, url, options = {}) => {
              try {
                if (injectRace && options.method === 'PATCH' && url.endsWith(`/git/refs/heads/${casBaseBranch}`)) {
                  injectRace = false;
                  const source = await github.rest.git.getCommit({ owner, repo, commit_sha: baseSha });
                  const blob = await github.rest.git.createBlob({ owner, repo, content: `concurrent base advance ${runKey}\\n`, encoding: 'utf-8' });
                  const tree = await github.rest.git.createTree({
                    owner, repo, base_tree: source.data.tree.sha,
                    tree: [{ path: raceFilePath, mode: '100644', type: 'blob', sha: blob.data.sha }]
                  });
                  const raceCommit = await github.rest.git.createCommit({
                    owner, repo, message: `test: simulate concurrent base advance ${runKey}`,
                    tree: tree.data.sha, parents: [baseSha]
                  });
                  raceCommitSha = raceCommit.data.sha;
                  await github.rest.git.updateRef({ owner, repo, ref: `heads/${casBaseBranch}`, sha: raceCommitSha, force: false });
                  core.info(`Injected competing base commit ${raceCommitSha} before the Worker CAS update.`);
                }
                const response = await github.request({
                  method: options.method || 'GET',
                  url,
                  headers: options.headers || {},
                  ...(options.body ? { data: JSON.parse(options.body) } : {})
                });
                return { ok: true, status: response.status, data: response.data };
              } catch (error) {
                return { ok: false, status: error.status || 0, msg: error.message, data: error.response && error.response.data };
              }
            };
            const sandbox = {
              URL, Date, Math, JSON, crypto: require('node:crypto').webcrypto,
              rand: () => runKey.slice(-8),
              codeVerifyRef: value => /^[A-Za-z0-9._/-]{1,120}$/.test(String(value)) ? String(value) : null,
              codeGhApi: ghApi,
              codeGitRefUrl: (r, ref) => `https://api.github.com/repos/${r}/git/ref/${String(ref).split('/').map(encodeURIComponent).join('/')}`,
              codeGitRefWriteUrl: (r, ref) => `https://api.github.com/repos/${r}/git/refs/${String(ref).split('/').map(encodeURIComponent).join('/')}`
            };
            vm.runInNewContext(worker.slice(start, end) + '\nglobalThis.__merge = codeMergeTempBranch;', sandbox);
            try {
              await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${baseBranch}`, sha: baseSha });
              baseCreated = true;
              await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${headBranch}`, sha: baseSha });
              headCreated = true;
              const source = await github.rest.git.getCommit({ owner, repo, commit_sha: baseSha });
              const blob = await github.rest.git.createBlob({ owner, repo, content: `real merge E2E ${runKey}\n`, encoding: 'utf-8' });
              const tree = await github.rest.git.createTree({
                owner, repo, base_tree: source.data.tree.sha,
                tree: [{ path: filePath, mode: '100644', type: 'blob', sha: blob.data.sha }]
              });
              const headCommit = await github.rest.git.createCommit({
                owner, repo, message: `test: real Worker merge E2E ${runKey}`,
                tree: tree.data.sha, parents: [baseSha]
              });
              await github.rest.git.updateRef({ owner, repo, ref: `heads/${headBranch}`, sha: headCommit.data.sha, force: false });
              result = await sandbox.__merge(
                {}, `${owner}/${repo}`, headBranch, baseBranch,
                `real Worker merge E2E ${runKey}`, baseSha, headCommit.data.sha
              );
              if (!result.ok) throw new Error(`Worker merge helper failed against real GitHub API: ${result.msg}`);
              const target = await github.rest.git.getRef({ owner, repo, ref: `heads/${baseBranch}` });
              if (target.data.object.sha !== result.data.sha) throw new Error('Target ref does not point to the Worker merge commit');
              const mergedCommit = await github.rest.git.getCommit({ owner, repo, commit_sha: result.data.sha });
              const parents = mergedCommit.data.parents.map(parent => parent.sha);
              if (parents.length !== 2 || parents[0] !== baseSha || parents[1] !== headCommit.data.sha) {
                throw new Error(`Unexpected merge commit parents: ${parents.join(',')}`);
              }
              const mergedTree = await github.rest.git.getTree({ owner, repo, tree_sha: mergedCommit.data.tree.sha, recursive: '1' });
              if (!(mergedTree.data.tree || []).some(entry => entry.path === filePath)) throw new Error('Merged tree is missing the staged test file');
              core.info(`PASS: exact Worker merge helper created ${result.data.sha} on disposable target ${baseBranch}; two parents and merged file verified.`);

              await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${casBaseBranch}`, sha: baseSha });
              casBaseCreated = true;
              await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${casHeadBranch}`, sha: baseSha });
              casHeadCreated = true;
              const casBlob = await github.rest.git.createBlob({ owner, repo, content: `CAS head change ${runKey}\\n`, encoding: 'utf-8' });
              const casTree = await github.rest.git.createTree({
                owner, repo, base_tree: source.data.tree.sha,
                tree: [{ path: casFilePath, mode: '100644', type: 'blob', sha: casBlob.data.sha }]
              });
              const casHeadCommit = await github.rest.git.createCommit({
                owner, repo, message: `test: Worker CAS head ${runKey}`,
                tree: casTree.data.sha, parents: [baseSha]
              });
              await github.rest.git.updateRef({ owner, repo, ref: `heads/${casHeadBranch}`, sha: casHeadCommit.data.sha, force: false });
              injectRace = true;
              const casResult = await sandbox.__merge(
                {}, `${owner}/${repo}`, casHeadBranch, casBaseBranch,
                `real Worker CAS E2E ${runKey}`, baseSha, casHeadCommit.data.sha
              );
              if (casResult.ok || !casResult.cas_rejected || !casResult.conflict) {
                throw new Error(`Worker failed to reject concurrent base advance: ${JSON.stringify(casResult)}`);
              }
              const casTarget = await github.rest.git.getRef({ owner, repo, ref: `heads/${casBaseBranch}` });
              if (casTarget.data.object.sha !== raceCommitSha) throw new Error('CAS failure overwrote the competing base commit');
              core.info(`PASS: exact Worker merge helper rejected non-fast-forward CAS and preserved competing commit ${raceCommitSha}.`);
            } catch (error) {
              failure = error;
            } finally {
              for (const [branch, created] of [[headBranch, headCreated], [baseBranch, baseCreated]]) {
                if (!created) continue;
                try { await github.rest.git.deleteRef({ owner, repo, ref: `heads/${branch}` }); }
                catch (error) { failure = failure || error; core.error(`Failed to clean ${branch}: ${error.message}`); }
              }
              try {
                const mainAfter = (await github.rest.git.getRef({ owner, repo, ref: 'heads/main' })).data.object.sha;
                if (mainAfter !== mainBefore) failure = failure || new Error(`main changed during merge E2E: ${mainBefore} -> ${mainAfter}`);
              } catch (error) { failure = failure || error; }
            }
            if (failure) throw failure;
            core.info('PASS: main SHA unchanged; disposable Worker merge refs cleaned.');
