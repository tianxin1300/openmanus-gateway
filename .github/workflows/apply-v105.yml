name: apply-v105

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-v105.yml"

permissions:
  contents: write

concurrency:
  group: apply-v105
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch worker.js
        run: |
          set -e
          test -f worker-v105.patch || { echo "找不到 worker-v105.patch"; exit 1; }
          if grep -qF 'code:pend:' worker.js && grep -qF '/api/code/confirm' worker.js; then
            echo "worker.js 已经带有 v105，跳过打补丁"
          else
            git apply --check worker-v105.patch || git apply --check --ignore-whitespace worker-v105.patch
            git apply worker-v105.patch || git apply --ignore-whitespace worker-v105.patch
            echo "worker.js 补丁已应用"
          fi
          grep -qF 'code_mode' worker.js
          grep -qF '/api/code/pending' worker.js
          grep -qF '/api/code/confirm' worker.js
          cp worker.js /tmp/worker-check.mjs
          node --check /tmp/worker-check.mjs
          echo "worker.js 语法检查通过"

      - name: Add studio.js script tag to index.html
        run: |
          set -e
          test -f frontend/studio.js || { echo "找不到 frontend/studio.js"; exit 1; }
          python3 - <<'PY'
          p = "frontend/index.html"
          s = open(p, encoding="utf-8", newline="").read()
          tag = '<script src="studio.js"></script>'
          if tag in s:
              print("index.html 已经加载 studio.js，跳过")
          else:
              for nl in ("\n", "\r\n"):
                  a = "</script>" + nl + "</body></html>"
                  if s.count(a) == 1:
                      s = s.replace(a, "</script>" + nl + tag + nl + "</body></html>")
                      open(p, "w", encoding="utf-8", newline="").write(s)
                      print("已在末尾唯一锚点处插入 studio.js")
                      break
              else:
                  raise SystemExit("末尾锚点没有恰好出现 1 次")
          s = open(p, encoding="utf-8", newline="").read()
          assert s.count(tag) == 1, "studio.js 的 script 标签数量不是 1"
          PY

      - name: Commit and push
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker.js frontend/index.html
          if git diff --cached --quiet; then
            echo "没有需要提交的改动"
            exit 0
          fi
          git commit -m "apply v105: worker.js 补丁 + index.html 加载 studio.js"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
