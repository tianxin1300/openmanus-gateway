name: deploy-jiuyibanlv-preview
run-name: 就医伴侣 Worker Preview ${{ inputs.action }} · ${{ inputs.preview_name }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: Create or delete an isolated Worker Preview
        required: true
        type: choice
        options:
          - create
          - delete
      ref:
        description: Temporary project branch to preview (code/*)
        required: true
        type: string
      request_id:
        description: Workbench preview request ID
        required: true
        type: string
      preview_name:
        description: Unique Cloudflare Worker Preview name
        required: true
        type: string
      deployment_id:
        description: Existing GitHub deployment ID (delete only)
        required: false
        type: string
      kv_namespace_id:
        description: Isolated preview KV namespace ID (delete only)
        required: false
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: jiuyibanlv-worker-preview-${{ inputs.preview_name }}
  cancel-in-progress: false

env:
  TARGET_REPOSITORY: tianxin1300/jiuyibanlv
  WORKER_NAME: juyiibanlvzhinengai

jobs:
  validate:
    name: Validate isolated project preview request
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Validate exact project and resource identity
        env:
          ACTION_NAME: ${{ inputs.action }}
          TARGET_REF: ${{ inputs.ref }}
          REQUEST_ID: ${{ inputs.request_id }}
          PREVIEW_NAME: ${{ inputs.preview_name }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          KV_NAMESPACE_ID: ${{ inputs.kv_namespace_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          action = os.environ["ACTION_NAME"]
          ref = os.environ["TARGET_REF"]
          request_id = os.environ["REQUEST_ID"]
          preview = os.environ["PREVIEW_NAME"]
          deployment_id = os.environ["DEPLOYMENT_ID"]
          kv_id = os.environ["KV_NAMESPACE_ID"]
          if action not in ("create", "delete"):
              raise SystemExit("Invalid action")
          if not ref.startswith("code/") or not re.fullmatch(r"[A-Za-z0-9._/-]{6,120}", ref) or any(p in ("", ".", "..") for p in ref.split("/")):
              raise SystemExit("Only a code/* temporary branch may be previewed")
          if not re.fullmatch(r"[A-Za-z0-9._:-]{8,160}", request_id):
              raise SystemExit("Invalid request ID")
          if not re.fullmatch(r"wb-[a-z0-9][a-z0-9-]{1,48}", preview):
              raise SystemExit("Invalid preview name")
          if action == "delete":
              if not re.fullmatch(r"[0-9]+", deployment_id):
                  raise SystemExit("Delete requires a numeric deployment ID")
              if not re.fullmatch(r"[0-9a-f]{32}", kv_id):
                  raise SystemExit("Delete requires the isolated KV namespace ID")
          PY

  create:
    name: Create isolated 就医伴侣 Worker Preview
    if: inputs.action == 'create'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout authorized project branch
        uses: actions/checkout@v4
        with:
          repository: tianxin1300/jiuyibanlv
          ref: ${{ inputs.ref }}
          path: project
          persist-credentials: false

      - name: Create per-preview isolated KV namespace
        id: kv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_NAME: ${{ inputs.preview_name }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          (async () => {
            const token = process.env.CLOUDFLARE_API_TOKEN || '';
            const account = process.env.CLOUDFLARE_ACCOUNT_ID || '';
            const preview = process.env.PREVIEW_NAME || '';
            if (!token || !account || !preview) throw new Error('Cloudflare credentials or preview name are missing');
            const title = `wbp-${preview}`;
            const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/storage/kv/namespaces`, {
              method: 'POST',
              headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({ title })
            });
            const body = await response.json().catch(() => ({}));
            const id = body?.result?.id;
            if (!response.ok || body.success !== true || !id) {
              const errors = Array.isArray(body.errors) ? body.errors.map(x => x.message || x.code).join('; ') : '';
              throw new Error(`Preview KV namespace creation failed (HTTP ${response.status})${errors ? `: ${errors}` : ''}`);
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `namespace_id=${id}\n`);
            fs.appendFileSync(process.env.GITHUB_ENV, `PREVIEW_KV_NAMESPACE_ID=${id}\n`);
            console.log('Created an isolated KV namespace for this 就医伴侣 preview.');
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE

      - name: Generate preview-only Wrangler configuration
        working-directory: project
        env:
          PREVIEW_KV_NAMESPACE_ID: ${{ steps.kv.outputs.namespace_id }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PREVIEW_KV_NAMESPACE_ID"
          cat > wrangler.preview.toml <<EOF
          name = "juyiibanlvzhinengai"
          main = "worker.js"
          compatibility_date = "2024-11-01"
          workers_dev = true

          [[migrations]]
          tag = "care-task-preview-v1"
          new_sqlite_classes = ["CareTask"]

          [previews.vars]
          APP_ENV = "preview"

          [[previews.kv_namespaces]]
          binding = "KV"
          id = "$PREVIEW_KV_NAMESPACE_ID"

          [[previews.durable_objects.bindings]]
          name = "CARE_TASKS"
          class_name = "CareTask"
          EOF
          # Deliberately omit production KV IDs, application secrets, and Cron triggers.
          ! grep -Fq "6f56242d19284338b3d2332d823e412d" wrangler.preview.toml
          ! grep -Fq '[triggers]' wrangler.preview.toml

      - name: Create GitHub deployment record
        id: deployment
        uses: actions/github-script@v7
        env:
          TARGET_REF: ${{ inputs.ref }}
          REQUEST_ID: ${{ inputs.request_id }}
          PREVIEW_NAME: ${{ inputs.preview_name }}
          PREVIEW_KV_NAMESPACE_ID: ${{ steps.kv.outputs.namespace_id }}
        with:
          script: |
            const payload = {
              request_id: process.env.REQUEST_ID,
              repository: "tianxin1300/jiuyibanlv",
              target_ref: process.env.TARGET_REF,
              preview_name: process.env.PREVIEW_NAME,
              worker_name: "juyiibanlvzhinengai",
              kv_namespace_id: process.env.PREVIEW_KV_NAMESPACE_ID
            };
            const created = await github.rest.repos.createDeployment({
              owner: context.repo.owner, repo: context.repo.repo,
              ref: "main", task: "workbench-jiuyibanlv-worker-preview",
              auto_merge: false, required_contexts: [], environment: "workbench-preview",
              transient_environment: true, production_environment: false,
              description: "Isolated Worker Preview for " + payload.repository + "@" + payload.target_ref,
              payload
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner, repo: context.repo.repo,
              deployment_id: created.data.id, state: "in_progress",
              description: "Creating isolated 就医伴侣 Worker Preview"
            });
            core.setOutput("deployment_id", String(created.data.id));

      - name: Create isolated Worker Preview (no production deploy)
        id: preview
        working-directory: project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_NAME: ${{ inputs.preview_name }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.135.0 preview --config wrangler.preview.toml --name "$PREVIEW_NAME" --ignore-base-config --json > /tmp/jiuyibanlv-worker-preview.json 2>&1
          cat /tmp/jiuyibanlv-worker-preview.json
          PREVIEW_URL="$(node -e 'const fs=require("node:fs");const s=fs.readFileSync("/tmp/jiuyibanlv-worker-preview.json","utf8");const start=s.indexOf("{\n  \"preview\":");if(start<0)throw new Error("Wrangler JSON result was not found");const d=JSON.parse(s.slice(start));const u=d.preview?.urls?.[0];if(!u)throw new Error("Wrangler did not return preview.urls[0]");process.stdout.write(u);')"
          case "$PREVIEW_URL" in https://*) ;; *) echo "Preview URL is not HTTPS" >&2; exit 1 ;; esac
          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Verify isolated Worker API health without patient data
        shell: bash
        run: |
          set -euo pipefail
          HTTP_CODE="$(curl -sS -o /tmp/jiuyibanlv-preview-health.json -w "%{http_code}" "$PREVIEW_URL/api/map")"
          echo "Isolated Worker API smoke status: $HTTP_CODE"
          test "$HTTP_CODE" = "200"
          node -e 'const fs=require("node:fs");const d=JSON.parse(fs.readFileSync("/tmp/jiuyibanlv-preview-health.json","utf8"));if(d?.ok!==true||typeof d.amapReady!=="boolean"||typeof d.tencentReady!=="boolean")throw new Error("Unexpected /api/map health response");console.log("Verified public API metadata response; no patient records were requested.");'

      - name: Mark GitHub deployment ready
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner, repo: context.repo.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID), state: "success",
              environment_url: process.env.PREVIEW_URL,
              log_url: context.serverUrl + "/" + context.repo.owner + "/" + context.repo.repo + "/actions/runs/" + context.runId,
              description: "Isolated Worker API verified with HTTP 200; no patient data accessed"
            });

      - name: Cleanup preview resources after failed creation
        if: failure()
        working-directory: project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_NAME: ${{ inputs.preview_name }}
          PREVIEW_KV_NAMESPACE_ID: ${{ steps.kv.outputs.namespace_id }}
        shell: bash
        run: |
          set -euo pipefail
          cleanup_failed=0
          cat > wrangler.cleanup.toml <<'EOF'
          name = "juyiibanlvzhinengai"
          main = "worker.js"
          compatibility_date = "2024-11-01"
          EOF
          if [ -n "${PREVIEW_NAME:-}" ]; then
            if ! npx --yes wrangler@4.135.0 preview delete --config wrangler.cleanup.toml --name "$PREVIEW_NAME" --skip-confirmation > /tmp/jiuyibanlv-preview-delete.log 2>&1; then
              cat /tmp/jiuyibanlv-preview-delete.log
              if ! grep -qiE 'not found|does not exist|404|10025' /tmp/jiuyibanlv-preview-delete.log; then cleanup_failed=1; fi
            fi
          fi
          if [ -n "${PREVIEW_KV_NAMESPACE_ID:-}" ] && [ "$cleanup_failed" -eq 0 ]; then
            node -e 'const token=process.env.CLOUDFLARE_API_TOKEN||"";const account=process.env.CLOUDFLARE_ACCOUNT_ID||"";const id=process.env.PREVIEW_KV_NAMESPACE_ID||"";(async()=>{if(!token||!account||!id)throw new Error("Missing credentials or isolated KV namespace ID");const r=await fetch("https://api.cloudflare.com/client/v4/accounts/"+account+"/storage/kv/namespaces/"+id,{method:"DELETE",headers:{Authorization:"Bearer "+token}});const d=await r.json().catch(()=>({}));if(!r.ok&&r.status!==404)throw new Error("Preview KV cleanup failed (HTTP "+r.status+")");if(r.ok&&d.success!==true)throw new Error("Preview KV cleanup response was not successful");console.log("Deleted failed-preview KV namespace.");})().catch(e=>{console.error(e.message);process.exitCode=1;});'
          elif [ "$cleanup_failed" -ne 0 ]; then
            echo "Preview deletion failed; isolated KV retained for safe recovery." >&2
          fi
          exit "$cleanup_failed"

      - name: Mark failed deployment
        if: failure() && steps.deployment.outputs.deployment_id != ''
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner, repo: context.repo.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID), state: "failure",
              description: "Isolated Worker Preview creation or verification failed"
            });

      - name: Summary
        if: always()
        run: |
          {
            echo "## Isolated 就医伴侣 Worker Preview"
            echo
            echo "- Repository: tianxin1300/jiuyibanlv"
            echo "- Ref: ${{ inputs.ref }}"
            echo "- Preview: ${{ inputs.preview_name }}"
            echo "- URL: ${PREVIEW_URL:-not-verified}"
            echo "- Production KV / DO / Cron: not used"
            echo "- Application secrets: not copied"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

  delete:
    name: Delete isolated 就医伴侣 Worker Preview
    if: inputs.action == 'delete'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Generate minimal preview deletion config
        shell: bash
        run: |
          cat > wrangler.delete.toml <<'EOF'
          name = "juyiibanlvzhinengai"
          main = "worker.js"
          compatibility_date = "2024-11-01"
          EOF

      - name: Verify deployment identity before deletion
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          TARGET_REF: ${{ inputs.ref }}
          REQUEST_ID: ${{ inputs.request_id }}
          PREVIEW_NAME: ${{ inputs.preview_name }}
          KV_NAMESPACE_ID: ${{ inputs.kv_namespace_id }}
        with:
          script: |
            const deploymentId = Number(process.env.DEPLOYMENT_ID);
            if (!Number.isSafeInteger(deploymentId) || deploymentId <= 0) throw new Error("Invalid deployment ID");
            const response = await github.rest.repos.getDeployment({
              owner: context.repo.owner, repo: context.repo.repo, deployment_id: deploymentId
            });
            const deployment = response.data;
            let payload = deployment.payload;
            if (typeof payload === "string") {
              try { payload = JSON.parse(payload); } catch { throw new Error("Deployment payload is not valid JSON"); }
            }
            const expected = {
              request_id: process.env.REQUEST_ID,
              repository: "tianxin1300/jiuyibanlv",
              target_ref: process.env.TARGET_REF,
              preview_name: process.env.PREVIEW_NAME,
              worker_name: "juyiibanlvzhinengai",
              kv_namespace_id: process.env.KV_NAMESPACE_ID
            };
            if (deployment.environment !== "workbench-preview" ||
                deployment.transient_environment !== true ||
                deployment.production_environment !== false) {
              throw new Error("Refusing deletion: deployment is not a transient workbench-preview environment");
            }
            for (const [key, value] of Object.entries(expected)) {
              if (String(payload?.[key] || "") !== String(value || "")) {
                throw new Error("Refusing deletion: deployment payload mismatch for " + key);
              }
            }
            core.info("Verified exact 就医伴侣 preview deployment identity.");

      - name: Verify isolated KV namespace ownership before deletion
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_NAME: ${{ inputs.preview_name }}
          PREVIEW_KV_NAMESPACE_ID: ${{ inputs.kv_namespace_id }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          (async () => {
            const token = process.env.CLOUDFLARE_API_TOKEN || '';
            const account = process.env.CLOUDFLARE_ACCOUNT_ID || '';
            const id = process.env.PREVIEW_KV_NAMESPACE_ID || '';
            const preview = process.env.PREVIEW_NAME || '';
            if (!token || !account || !id || !preview) throw new Error('Missing credentials or preview identity');
            const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/storage/kv/namespaces/${id}`, {
              headers: { Authorization: `Bearer ${token}` }
            });
            if (response.status === 404) {
              console.log('Isolated KV namespace is already absent; cleanup remains idempotent.');
              return;
            }
            const body = await response.json().catch(() => ({}));
            if (!response.ok || body.success !== true || String(body.result?.id || '') !== id) {
              throw new Error(`Could not verify isolated KV ownership (HTTP ${response.status})`);
            }
            if (String(body.result?.title || '') !== `wbp-${preview}`) {
              throw new Error('Refusing deletion: KV title does not match this preview');
            }
            console.log('Verified isolated KV namespace ownership.');
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE

      - name: Mark cleanup in progress
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner, repo: context.repo.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID), state: "in_progress",
              description: "Deleting isolated 就医伴侣 Worker Preview and KV"
            });

      - name: Delete isolated Worker Preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_NAME: ${{ inputs.preview_name }}
        shell: bash
        run: |
          set -euo pipefail
          if ! npx --yes wrangler@4.135.0 preview delete --config wrangler.delete.toml --name "$PREVIEW_NAME" --skip-confirmation > /tmp/jiuyibanlv-preview-delete.log 2>&1; then
            cat /tmp/jiuyibanlv-preview-delete.log
            if ! grep -qiE 'not found|does not exist|404|10025' /tmp/jiuyibanlv-preview-delete.log; then exit 1; fi
          fi
          echo "Isolated 就医伴侣 Worker Preview deleted or already absent."

      - name: Delete isolated KV namespace
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_KV_NAMESPACE_ID: ${{ inputs.kv_namespace_id }}
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const token=process.env.CLOUDFLARE_API_TOKEN||"";const account=process.env.CLOUDFLARE_ACCOUNT_ID||"";const id=process.env.PREVIEW_KV_NAMESPACE_ID||"";(async()=>{if(!token||!account||!id)throw new Error("Missing credentials or isolated KV namespace ID");const r=await fetch("https://api.cloudflare.com/client/v4/accounts/"+account+"/storage/kv/namespaces/"+id,{method:"DELETE",headers:{Authorization:"Bearer "+token}});const d=await r.json().catch(()=>({}));if(!r.ok&&r.status!==404)throw new Error("Preview KV deletion failed (HTTP "+r.status+")");if(r.ok&&d.success!==true)throw new Error("Preview KV deletion response was not successful");console.log("Isolated KV namespace deleted or already absent.");})().catch(e=>{console.error(e.message);process.exitCode=1;});'

      - name: Verify Worker Preview and isolated KV are absent after deletion
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_NAME: ${{ inputs.preview_name }}
          PREVIEW_KV_NAMESPACE_ID: ${{ inputs.kv_namespace_id }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          (async () => {
            const token = process.env.CLOUDFLARE_API_TOKEN || '';
            const account = process.env.CLOUDFLARE_ACCOUNT_ID || '';
            const preview = process.env.PREVIEW_NAME || '';
            const worker = 'juyiibanlvzhinengai';
            const namespace = process.env.PREVIEW_KV_NAMESPACE_ID || '';
            if (!token || !account || !preview || !namespace) throw new Error('Missing resource identity for post-delete verification');
            const headers = { Authorization: `Bearer ${token}` };
            const workerUrl = `https://api.cloudflare.com/client/v4/accounts/${account}/workers/workers/${encodeURIComponent(worker)}/previews/${encodeURIComponent(preview)}`;
            const workerResponse = await fetch(workerUrl, { headers });
            if (workerResponse.status !== 404) {
              if (workerResponse.ok) throw new Error('Worker Preview still exists after deletion');
              throw new Error(`Worker Preview absence check failed (HTTP ${workerResponse.status})`);
            }
            console.log('Verified: 就医伴侣 Worker Preview is absent (HTTP 404).');
            const kvUrl = `https://api.cloudflare.com/client/v4/accounts/${account}/storage/kv/namespaces/${namespace}`;
            const kvResponse = await fetch(kvUrl, { headers });
            if (kvResponse.status !== 404) {
              if (kvResponse.ok) throw new Error('Isolated KV namespace still exists after deletion');
              throw new Error(`Isolated KV absence check failed (HTTP ${kvResponse.status})`);
            }
            console.log('Verified: 就医伴侣 isolated KV namespace is absent (HTTP 404).');
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE

      - name: Mark cleanup failure
        if: failure()
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner, repo: context.repo.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID), state: "failure",
              description: "Isolated 就医伴侣 preview cleanup failed"
            });

      - name: Mark deployment inactive
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner, repo: context.repo.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID), state: "inactive",
              description: "Isolated 就医伴侣 Worker Preview and KV deleted"
            });

      - name: Verify latest GitHub Deployment status is inactive
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        with:
          script: |
            const deploymentId = Number(process.env.DEPLOYMENT_ID);
            if (!Number.isSafeInteger(deploymentId) || deploymentId <= 0) throw new Error("Invalid deployment ID");
            const response = await github.rest.repos.listDeploymentStatuses({
              owner: context.repo.owner, repo: context.repo.repo,
              deployment_id: deploymentId, per_page: 100
            });
            const statuses = response.data.slice().sort((a, b) =>
              Date.parse(b.created_at) - Date.parse(a.created_at)
            );
            const latest = statuses[0];
            if (!latest || latest.state !== "inactive") {
              throw new Error("Latest GitHub Deployment status is not inactive; observed: " + (latest?.state || "no statuses"));
            }
            core.info("Verified: GitHub Deployment latest status is inactive.");

      - name: Summary
        if: always()
        run: |
          {
            echo "## 就医伴侣 Worker Preview cleanup"
            echo
            echo "- Preview: ${{ inputs.preview_name }}"
            echo "- Deployment ID: ${{ inputs.deployment_id }}"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
