name: probe-jiuyibanlv-worker-preview
run-name: Worker Preview isolation probe · jiuyibanlv

on:
  push:
    branches:
      - code/dynamic-project-registry-preview-phase2-20261128
    paths:
      - .github/workflows/probe-jiuyibanlv-worker-preview.yml

permissions:
  contents: read

concurrency:
  group: jiuyibanlv-worker-preview-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout gateway workflow repository
        uses: actions/checkout@v4
        with:
          path: gateway

      - name: Checkout authorized Worker project
        uses: actions/checkout@v4
        with:
          repository: tianxin1300/jiuyibanlv
          ref: main
          path: jiuyibanlv

      - name: Clean orphaned preview from the previous probe
        working-directory: jiuyibanlv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          OLD_PREVIEW_NAME="probe-46087160969-1"
          OLD_KV_NAMESPACE_ID="f26b0ba27b6c45ce9faf5386190f2f15"
          OLD_PREVIEW_URL="https://probe-46087160969-1-juyiibanlvzhinengai.tianxinyuan881.workers.dev"
          HTTP_CODE="$(curl -sS -o /dev/null -w "%{http_code}" "$OLD_PREVIEW_URL/" || true)"
          echo "Previous probe preview HTTP status before cleanup: $HTTP_CODE"
          if ! npx --yes wrangler@4.135.0 preview delete --name "$OLD_PREVIEW_NAME" --worker-name juyiibanlvzhinengai --skip-confirmation > /tmp/old-preview-delete.log 2>&1; then
            cat /tmp/old-preview-delete.log
            if ! grep -qiE 'not found|does not exist|404' /tmp/old-preview-delete.log; then
              echo "Could not verify deletion of the previous Worker Preview; keeping its KV namespace." >&2
              exit 1
            fi
          fi
          node -e 'const token=process.env.CLOUDFLARE_API_TOKEN||""; const account=process.env.CLOUDFLARE_ACCOUNT_ID||""; const id="f26b0ba27b6c45ce9faf5386190f2f15"; (async()=>{if(!token||!account)throw new Error("Missing Cloudflare credentials for orphan cleanup");const r=await fetch("https://api.cloudflare.com/client/v4/accounts/"+account+"/storage/kv/namespaces/"+id,{method:"DELETE",headers:{Authorization:"Bearer "+token}});const d=await r.json().catch(()=>({}));if(!r.ok&&r.status!==404)throw new Error("Orphan KV deletion failed (HTTP "+r.status+")");if(r.ok&&d.success!==true)throw new Error("Orphan KV deletion response was not successful");console.log("Previous probe KV namespace deleted or already absent.");})().catch(e=>{console.error(e.message);process.exitCode=1;});'
          echo "Previous probe preview cleanup completed."

      - name: Create isolated preview KV namespace
        id: kv
        working-directory: jiuyibanlv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          TITLE="jiuyibanlv-preview-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          node <<'NODE'
          const fs = require('node:fs');
          (async () => {
            const token = process.env.CLOUDFLARE_API_TOKEN || '';
            const account = process.env.CLOUDFLARE_ACCOUNT_ID || '';
            if (!token || !account) throw new Error('Cloudflare credentials are not configured in this repository');
            const title = `jiuyibanlv-preview-probe-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`;
            const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/storage/kv/namespaces`, {
              method: 'POST',
              headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({ title })
            });
            const body = await response.json().catch(() => ({}));
            const id = body?.result?.id;
            if (!response.ok || body.success !== true || !id) {
              const errors = Array.isArray(body.errors) ? body.errors.map(x => x.message || x.code).join('; ') : '';
              throw new Error(`KV namespace creation failed (HTTP ${response.status})${errors ? `: ${errors}` : ''}`);
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `namespace_id=${id}\n`);
            fs.appendFileSync(process.env.GITHUB_ENV, `PREVIEW_KV_NAMESPACE_ID=${id}\n`);
            console.log('Created a disposable KV namespace for this preview probe.');
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE
          echo "PREVIEW_NAME=probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Generate preview-only Wrangler configuration
        working-directory: jiuyibanlv
        env:
          PREVIEW_KV_NAMESPACE_ID: ${{ steps.kv.outputs.namespace_id }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PREVIEW_KV_NAMESPACE_ID"
          cat > wrangler.preview.toml <<EOF
          name = "juyiibanlvzhinengai"
          main = "worker.js"
          compatibility_date = "2024-11-01"
          workers_dev = true

          [[migrations]]
          tag = "v1"
          new_sqlite_classes = ["CareTask"]

          [assets]
          directory = "./frontend"
          run_worker_first = ["/api/*"]

          [previews.vars]
          APP_ENV = "preview"

          [[previews.kv_namespaces]]
          binding = "KV"
          id = "$PREVIEW_KV_NAMESPACE_ID"

          [[previews.durable_objects.bindings]]
          name = "CARE_TASKS"
          class_name = "CareTask"
          EOF

      - name: Create isolated Cloudflare Worker Preview
        id: preview
        working-directory: jiuyibanlv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.135.0 preview --config wrangler.preview.toml --name "$PREVIEW_NAME" --ignore-base-config --json > /tmp/worker-preview.json
          cat /tmp/worker-preview.json
          PREVIEW_URL="$(node -e 'const fs=require("node:fs");const s=fs.readFileSync("/tmp/worker-preview.json","utf8").replace(/\\u001b\\[[0-9;]*m/g,"");const m=s.match(/\\{\\s*"preview"\\s*:/);if(!m)throw new Error("Wrangler JSON result was not found in command output");const d=JSON.parse(s.slice(m.index));const u=d.preview?.urls?.[0];if(!u)throw new Error("Wrangler JSON result did not contain preview.urls[0]");process.stdout.write(u);')"
          case "$PREVIEW_URL" in https://*) ;; *) echo "Preview URL is not HTTPS" >&2; exit 1 ;; esac
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"
          echo "Worker Preview was created with isolated KV and Durable Object bindings."

      - name: Verify isolated Worker Preview serves the frontend
        shell: bash
        run: |
          set -euo pipefail
          HTTP_CODE="$(curl -sS -o /tmp/preview-index.html -w "%{http_code}" "$PREVIEW_URL/")"
          echo "Worker Preview HTTP status: $HTTP_CODE"
          test "$HTTP_CODE" = "200"
          test -s /tmp/preview-index.html
          echo "PASS: isolated Worker Preview served the frontend with HTTP 200."

      - name: Delete disposable Worker Preview and KV namespace
        if: always()
        working-directory: jiuyibanlv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          cleanup_failed=0
          if [ -n "${PREVIEW_NAME:-}" ]; then
            if ! npx --yes wrangler@4.135.0 preview delete --config wrangler.preview.toml --name "$PREVIEW_NAME" --skip-confirmation > /tmp/preview-delete.log 2>&1; then
              cat /tmp/preview-delete.log
              if ! grep -qiE 'not found|does not exist|404' /tmp/preview-delete.log; then
                cleanup_failed=1
              fi
            fi
          fi
          if [ -n "${PREVIEW_KV_NAMESPACE_ID:-}" ] && [ "$cleanup_failed" -eq 0 ]; then
            node -e 'const token=process.env.CLOUDFLARE_API_TOKEN||"";const account=process.env.CLOUDFLARE_ACCOUNT_ID||"";const id=process.env.PREVIEW_KV_NAMESPACE_ID||"";(async()=>{if(!token||!account||!id)throw new Error("Missing credentials or namespace ID for cleanup");const r=await fetch("https://api.cloudflare.com/client/v4/accounts/"+account+"/storage/kv/namespaces/"+id,{method:"DELETE",headers:{Authorization:"Bearer "+token}});const d=await r.json().catch(()=>({}));if(!r.ok&&r.status!==404)throw new Error("KV cleanup failed (HTTP "+r.status+")");if(r.ok&&d.success!==true)throw new Error("KV cleanup response was not successful");console.log("Deleted the disposable preview KV namespace.");})().catch(e=>{console.error(e.message);process.exitCode=1;});'
          elif [ "$cleanup_failed" -ne 0 ]; then
            echo "Preview deletion failed; isolated KV namespace was retained for safe recovery." >&2
          fi
          exit "$cleanup_failed"

      - name: Summary
        if: always()
        run: |
          {
            echo "## jiuyibanlv Worker Preview isolation probe"
            echo
            echo "- Preview name: ${PREVIEW_NAME:-not-created}"
            echo "- Preview URL: ${PREVIEW_URL:-not-verified}"
            echo "- Preview-only APP_ENV: preview"
            echo "- Production KV/DO bindings: not included"
            echo "- Cleanup step status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
