name: deploy-branch-preview
run-name: branch preview · ${{ github.event.inputs.ref || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Temporary branch preview request id"
        required: false
        type: string
      ref:
        description: "Temporary code branch to preview"
        required: true
        type: string

permissions:
  contents: read

env:
  DEPLOY_REF: ${{ github.event.inputs.ref || github.ref_name }}
  DEPLOY_REQUEST_ID: ${{ github.event.inputs.request_id || 'manual' }}

jobs:
  preview:
    name: verify, build and deploy branch preview
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Validate deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          ref = os.environ["DEPLOY_REF"]
          request_id = os.environ["DEPLOY_REQUEST_ID"]
          if not 1 <= len(ref) <= 120 or ref != ref.strip() or any(c in ref for c in ["\r", "\n", '"', "'", ";", "]", "\\", "$", "(", "&"]):
              raise SystemExit("Invalid ref")
          if not re.fullmatch(r"(?:[0-9a-fA-F]{7,64}|[A-Za-z0-9._/-]+)", ref) or any(p in ("", ".", "..") for p in ref.split("/")):
              raise SystemExit("Ref must be a branch name or commit SHA")
          if len(request_id) > 160 or "\r" in request_id or "\n" in request_id:
              raise SystemExit("Invalid request id")
          PY
      - name: Checkout temporary branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Deploy temporary Pages preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler pages deploy . --project-name zhineng --branch "$DEPLOY_REF" --commit-dirty=true 2>&1 | tee /tmp/branch-preview-deploy.log
          PREVIEW_URL="$(sed -nE 's/^.*Deployment alias URL: (https:\/\/[^[:space:]]+).*$/\1/p' /tmp/branch-preview-deploy.log | tail -n 1)"
          if [ -z "$PREVIEW_URL" ]; then
            echo "Could not determine the deployed Pages preview URL from Wrangler output." >&2
            exit 1
          fi
          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"
          echo "Preview URL: $PREVIEW_URL"
      - name: Verify preview HTTP 200 with curl
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            HTTP_CODE="$(curl -s -o /dev/null -w "%{http_code}" "$PREVIEW_URL")"
            echo "Preview HTTP status (attempt $attempt): $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "PASS: preview returned HTTP 200."
              exit 0
            fi
            sleep 10
          done
          echo "FAIL: preview did not return HTTP 200: $PREVIEW_URL" >&2
          exit 1
      - name: Verify preview opens with Playwright
        env:
          PREVIEW_URL: ${{ env.PREVIEW_URL }}
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              const page = await browser.newPage();
              const response = await page.goto(process.env.PREVIEW_URL, {
                waitUntil: 'domcontentloaded',
                timeout: 60000
              });
              const status = response ? response.status() : 0;
              if (status !== 200) {
                throw new Error(`Playwright navigation failed: HTTP ${status} at ${process.env.PREVIEW_URL}`);
              }
              console.log(`PASS: Playwright page.goto opened ${page.url()} with HTTP ${status}`);
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
      - name: Summary
        if: always()
        run: |
          { echo "## Temporary Pages preview"; echo; echo "- Ref: $DEPLOY_REF"; echo "- Request: $DEPLOY_REQUEST_ID"; echo "- Result: ${{ job.status }}"; } >> "$GITHUB_STEP_SUMMARY"
