name: deploy-branch-preview
run-name: branch preview · ${{ github.event.inputs.ref || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Temporary branch preview request id"
        required: false
        type: string
      ref:
        description: "Temporary code branch to preview"
        required: true
        type: string

permissions:
  contents: read

env:
  DEPLOY_REF: ${{ github.event.inputs.ref || github.ref_name }}
  DEPLOY_REQUEST_ID: ${{ github.event.inputs.request_id || 'manual' }}

jobs:
  preview:
    name: verify, build and deploy branch preview
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Validate deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          ref = os.environ["DEPLOY_REF"]
          request_id = os.environ["DEPLOY_REQUEST_ID"]
          if not 1 <= len(ref) <= 120 or ref != ref.strip() or any(c in ref for c in ["\r", "\n", '"', "'", ";", "]", "\\", "$", "(", "&"]):
              raise SystemExit("Invalid ref")
          if not re.fullmatch(r"(?:[0-9a-fA-F]{7,64}|[A-Za-z0-9._/-]+)", ref) or any(p in ("", ".", "..") for p in ref.split("/")):
              raise SystemExit("Ref must be a branch name or commit SHA")
          if len(request_id) > 160 or "\r" in request_id or "\n" in request_id:
              raise SystemExit("Invalid request id")
          PY
      - name: Checkout temporary branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Deploy temporary Pages preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: frontend
        run: npx wrangler pages deploy . --project-name zhineng --branch "$DEPLOY_REF" --commit-dirty=true
      - name: Summary
        if: always()
        run: |
          { echo "## Temporary Pages preview"; echo; echo "- Ref: $DEPLOY_REF"; echo "- Request: $DEPLOY_REQUEST_ID"; echo "- Result: ${{ job.status }}"; } >> "$GITHUB_STEP_SUMMARY"
