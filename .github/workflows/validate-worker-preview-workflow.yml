name: validate-worker-preview-workflow
on:
  push:
    branches:
      - code/dynamic-project-registry-preview-phase2-20261128
    paths:
      - .github/workflows/validate-worker-preview-workflow.yml
permissions:
  contents: read
jobs:
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tianxin1300/openmanus-gateway
          ref: code/worker-preview-workflow-20261128
          path: worker-preview-workflow
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Validate Worker Preview workflow
        run: "$(go env GOPATH)/bin/actionlint" worker-preview-workflow/.github/workflows/deploy-worker-preview.yml
