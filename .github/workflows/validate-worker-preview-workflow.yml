name: validate-worker-preview-workflow
on:
  push:
    branches:
      - code/worker-preview-workflow-20261128
    paths:
      - .github/workflows/deploy-worker-preview.yml
      - .github/workflows/validate-worker-preview-workflow.yml
permissions:
  contents: read
jobs:
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Validate GitHub Actions workflow
        run: "$(go env GOPATH)/bin/actionlint" .github/workflows/deploy-worker-preview.yml
